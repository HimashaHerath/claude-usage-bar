name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build universal app
        run: make build SIGN_ID=-
      - name: Check both architectures
        run: lipo -archs "build/Claude Usage.app/Contents/MacOS/ClaudeUsage" | grep -q "x86_64 arm64"
